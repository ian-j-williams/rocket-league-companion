name: Build and Test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

  build:
    name: Native build for ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            artifact: rocketleague-companion-linux-amd64
            out: dist/rocketleague-companion-linux-amd64
          - name: Windows
            runner: windows-latest
            artifact: rocketleague-companion-windows-amd64.exe
            out: dist/rocketleague-companion-windows-amd64.exe
          - name: macOS
            runner: macos-latest
            artifact: rocketleague-companion-darwin-arm64
            out: dist/rocketleague-companion-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Linux UI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "${{ matrix.out }}" ./cmd/companion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
